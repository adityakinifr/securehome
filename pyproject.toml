[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["securehome*"]

[project]
name = "securehome"
version = "0.1.0"
description = "Google Home security monitoring app — night checks, visitor summaries, and device control"
requires-python = ">=3.10"
dependencies = [
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-api-python-client>=2.100.0",
    "google-cloud-pubsub>=2.18.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "rich>=13.6.0",
    "schedule>=1.2.0",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
schlage = ["pyschlage>=2024.1.0"]
kasa = ["python-kasa>=0.7.0"]
all = ["pyschlage>=2024.1.0", "python-kasa>=0.7.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
]

[project.scripts]
securehome = "securehome.cli:main"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
